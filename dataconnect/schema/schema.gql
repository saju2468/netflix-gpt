type User @table {
  uid: String!
  email: String!
  createdAt: Timestamp!
  displayName: String
  avatarUrl: String
  preferredGenres: [String]
}

type Movie @table {
  tmdbId: Int64!
  title: String!
  posterUrl: String!
  releaseDate: Date
  genreList: [String]
}

type Favorite @table {
  user: User!
  movie: Movie!
  createdAt: Timestamp!
}

type Recommendation @table {
  user: User!
  movie: Movie!
  reason: String!
  score: Float
}

type Review @table {
  user: User!
  movie: Movie!
  rating: Int!
  comment: String
  createdAt: Timestamp!
}